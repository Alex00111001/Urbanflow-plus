[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanflow-plus-backend"
version = "0.1.0"
description = "UrbanFlow+ multimodal mobility API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<0.112.0",
    "uvicorn[standard]>=0.27,<0.29",
    "pydantic>=2.6,<3.0",
]

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
